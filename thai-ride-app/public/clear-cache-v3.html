<!DOCTYPE html>
<html>
<head>
  <title>Clear Cache v3</title>
  <meta charset="UTF-8">
</head>
<body>
  <h1>🔄 Clearing All Caches...</h1>
  <div id="status">กำลังล้าง cache...</div>
  
  <script>
    async function clearEverything() {
      const status = document.getElementById('status');
      
      try {
        // 1. Clear Service Workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
          }
          status.innerHTML += '<br>✅ Service Workers cleared';
        }
        
        // 2. Clear Cache Storage
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          status.innerHTML += '<br>✅ Cache Storage cleared';
        }
        
        // 3. Clear Local Storage
        localStorage.clear();
        status.innerHTML += '<br>✅ LocalStorage cleared';
        
        // 4. Clear Session Storage
        sessionStorage.clear();
        status.innerHTML += '<br>✅ SessionStorage cleared';
        
        // 5. Clear IndexedDB
        if ('indexedDB' in window) {
          const dbs = await indexedDB.databases();
          for (const db of dbs) {
            if (db.name) indexedDB.deleteDatabase(db.name);
          }
          status.innerHTML += '<br>✅ IndexedDB cleared';
        }
        
        status.innerHTML += '<br><br><h2>✅ ล้าง cache เสร็จสิ้น!</h2>';
        status.innerHTML += '<p>กรุณารอ 3 วินาที แล้วจะ redirect...</p>';
        
        setTimeout(() => {
          window.location.href = '/admin/customers?_=' + Date.now();
        }, 3000);
        
      } catch (error) {
        status.innerHTML += '<br>❌ Error: ' + error.message;
      }
    }
    
    clearEverything();
  </script>
</body>
</html>
